<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Camera Privacy Policy and Terms</title>
    <meta
      name="description"
      content="AI Camera privacy policy and terms of service in Chinese and English."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow" data-i18n="eyebrow">AI Camera</p>
          <h1 data-i18n="title">隐私政策与服务条款</h1>
          <p class="intro" data-i18n="intro"></p>
        </div>
        <div class="language-switch" aria-label="Language">
          <button type="button" class="language-button is-active" data-language="zh">
            中文
          </button>
          <button type="button" class="language-button" data-language="en">
            English
          </button>
        </div>
      </header>

      <section class="summary-panel" aria-labelledby="summary-title">
        <h2 id="summary-title" data-i18n="summaryTitle"></h2>
        <dl class="meta-grid">
          <div>
            <dt data-i18n="updatedLabel"></dt>
            <dd data-i18n="updatedValue"></dd>
          </div>
          <div>
            <dt data-i18n="contactLabel"></dt>
            <dd>
              <a href="mailto:privacy@example.com">privacy@example.com</a>
            </dd>
          </div>
          <div>
            <dt data-i18n="operatorLabel"></dt>
            <dd>AI Camera</dd>
          </div>
        </dl>
      </section>

      <nav class="toc" aria-label="Contents" id="toc"></nav>

      <article class="content" id="content"></article>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
